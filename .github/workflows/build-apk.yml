name: Build ASP TV APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASPTV-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release on Tag or Dispatch
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: ASP TV Live v1.0.0
          tag_name: v1.0.0
          body: |
            ## ASP TV Live - Android TV APK 📺
            
            - **Marathi, Hindi & English Live News**
            - **Leanback 10-foot TV UI with Remote D-Pad Navigation**
            - **Fullscreen 16:9 Playback with Instant ▲ / ▼ Channel Zapping**
            
            Download `app-release.apk` below and install it directly on your Android TV or Fire TV Stick.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
