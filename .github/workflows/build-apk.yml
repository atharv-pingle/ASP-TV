name: Build ASP TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: flutter build apk --release --verbose

      - name: Prepare Direct APK Asset
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ASP-TV-v1.0.0.apk

      - name: Upload Release APK Artifact (Zip Backup)
        uses: actions/upload-artifact@v4
        with:
          name: ASPTV-Release-APK
          path: build/app/outputs/flutter-apk/ASP-TV-v1.0.0.apk

      - name: Publish Direct Release APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/ASP-TV-v1.0.0.apk
          name: ASP TV v1.0.0
          tag_name: v1.0.0
          make_latest: true
          body: |
            ## ASP TV Live - Android TV APK 📺
            
            - **Marathi, Hindi & English Live News Channels**
            - **Remote D-Pad Navigation & Channel Surfing**
            - **VU TV & Android TV Remote OK Key Selection**
            - **Channel Up / Down Physical Remote Buttons Supported**
            - **Video Stretch & Fill Screen Aspect Ratio Mode**
            - **Hold OK / Long-Press on any channel to Add to Favorites**
            
            👉 **Direct Download**: Download `ASP-TV-v1.0.0.apk` below directly to install on your Android TV or Fire TV Stick.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
