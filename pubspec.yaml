name: asp_tv
description: "ASP TV - Live Television, Entertainment, Movies, Kids & Infotainment for Android TV"
publish_to: 'none'
version: 1.0.17+18

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  video_player: ^2.9.2
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/news_channels.json
    - assets/data/indian_news.m3u
    - assets/images/
